<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Librarian OS</title>
    <meta name="description" content="Librarian OS: a reader for Markdown knowledge repositories." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f5e'/%3E%3Cpath d='M9 8h4v16H9zM15 8h4v16h-4zM21 10l4 1-3 13-4-1z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" />
    <script>
      // Apply the saved theme before the first paint so the page does not flash.
      (function () {
        var dark = false;
        try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var theme = dark ? 'dark' : 'light';
        try {
          var saved = JSON.parse(localStorage.getItem('librarian.settings.v1') || '{}').theme;
          if (saved && saved !== 'system') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>The reader needs JavaScript. Start it with "npm run dev" in the _librarian directory.</noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
